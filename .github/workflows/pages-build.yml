name: 검색용 페이지 갱신

# 사료·글이 바뀌면 /food/<id>/ · /content/<id>/ · sitemap.xml 을 다시 만든다.
# 화면 주소가 # 방식이라 검색엔진은 이 파일들로만 사료를 읽는다 (scripts/build-pages.mjs 머리말).
# 어드민이 data.js 를 커밋하면 이게 돌아서, 사람이 따로 할 일은 없다.

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'articles.js'
      - 'index.html'
      - 'app.js'
      - 'scripts/build-pages.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 페이지 생성
        run: node scripts/build-pages.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A food content sitemap.xml
          if git diff --cached --quiet; then
            echo '검색용 페이지에 바뀐 내용이 없습니다.'
            exit 0
          fi
          git commit -m '검색용 페이지 갱신' -m '자동 실행입니다. scripts/build-pages.mjs'
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || exit 1
          done
