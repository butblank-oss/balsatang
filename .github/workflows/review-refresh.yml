name: 심사 목록 갱신

# 심사 화면은 data/staging/review.json 을 읽는다. 그 파일은 게이트를 돌려야 생긴다.
# 예전에는 사람이 `npm run review` 를 실행해 줘야 심사 목록이 최신이 됐다.
# 이 워크플로가 그 자리를 대신한다 — 스테이징이 바뀌면, 그리고 매일 한 번 돈다.
#
# 발행 자체는 하지 않는다. 사람이 심사 화면에서 누르는 것까지가 발행이다.

on:
  push:
    branches: [main]
    paths:
      - 'data/staging/**'
      - 'scripts/**'
      - 'engine/dict.js'
      - 'engine/engine.js'
  schedule:
    # 매일 오전 9시(KST) = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 여러 개가 겹쳐 돌면 서로 밀어낸다. 마지막 것만 살린다.
concurrency:
  group: review-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 게이트 1 · 기계 검사
        run: node scripts/gate1-validate.mjs --live || true

      - name: 게이트 3 · 정합성 검사
        run: node scripts/gate3-consistency.mjs || true

      - name: 심사 데이터 생성
        run: node scripts/build-review.mjs --live

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # _review.json 은 .gitignore 에 있다(로컬 스크립트용 원본). 배포본만 올린다.
          git add data/staging/review.json
          if git diff --cached --quiet; then
            echo '심사 목록에 바뀐 내용이 없습니다.'
            exit 0
          fi
          TOTAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/staging/review.json','utf8')).summary.total)")
          READY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/staging/review.json','utf8')).summary.ready)")
          git commit -m "심사 목록 갱신 — 대기 ${TOTAL}건 · 발행 후보 ${READY}건" \
                     -m '자동 실행입니다. 발행은 심사 화면에서 사람이 누릅니다.'
          # 그 사이 누가 올렸으면 다시 얹어서 올린다
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || exit 1
          done
