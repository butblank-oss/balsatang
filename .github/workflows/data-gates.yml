name: 데이터 게이트

# 스테이징에 사료 후보가 올라오면 게이트를 돌린다.
# 게이트 1 탈락 건이 있으면 CI가 실패하므로 그대로 머지되지 않는다.
on:
  pull_request:
    paths:
      - 'data/staging/**'
      - 'data.js'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: data.js 검사 — 병합 충돌·문법 오류가 배포되지 않도록
        run: node scripts/verify-data.mjs

      - name: 화면 간 연동 검사 — 한쪽에서 고친 값이 다른 쪽에서 사라지지 않도록
        run: node scripts/verify-surfaces.mjs

      - name: 게이트 1 · 기계 검사 (URL 실접속 포함)
        id: g1
        run: node scripts/gate1-validate.mjs --live | tee /tmp/g1.txt
        continue-on-error: true

      - name: 게이트 3 · 정합성 검사
        run: node scripts/gate3-consistency.mjs | tee /tmp/g3.txt
        continue-on-error: true

      - name: 심사 데이터 생성
        run: node scripts/build-review.mjs --live

      - name: 심사 데이터 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: review-data
          path: data/staging/_review.json

      - name: PR에 결과 코멘트
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(결과 없음)'; } };
            const review = JSON.parse(read('data/staging/_review.json') || '{}');
            const s = review.summary ?? { total: 0, ready: 0, blocked: 0 };
            const body = [
              '## 데이터 게이트 결과',
              '',
              `전체 **${s.total}** · 발행 후보 **${s.ready}** · 보류 **${s.blocked}**`,
              '',
              '<details><summary>게이트 1 · 기계 검사</summary>',
              '', '```', read('/tmp/g1.txt').slice(0, 30000), '```', '</details>',
              '',
              '<details><summary>게이트 3 · 정합성 검사</summary>',
              '', '```', read('/tmp/g3.txt').slice(0, 20000), '```', '</details>',
              '',
              s.ready > 0
                ? '어드민 `/admin/review.html` 에서 출처를 확인하고 발행 여부를 결정하세요.'
                : '발행 후보가 없습니다. 게이트를 통과한 항목이 없습니다.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      - name: 게이트 1 탈락 시 실패 처리
        if: steps.g1.outcome == 'failure'
        run: |
          echo "게이트 1을 통과하지 못한 항목이 있습니다. 위 코멘트를 확인하세요."
          exit 1
