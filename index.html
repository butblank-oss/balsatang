<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>발사탕 — 광고 없는 사료 성분 분석</title>
<meta name="description" content="사료 성분표만 보고 솔직하게 분석해요. 광고비는 1원도 받지 않아요.">
<link rel="icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css?v=202608040744">
<style>
/* 위저드 입력칸 — app.css 의 공통 컴포넌트가 아니라 이 화면 전용 */
.wz-in{width:100%;height:56px;padding:0 16px;border-radius:var(--rInput);background:var(--surfaceInput);
  font-size:16px;font-weight:600;letter-spacing:-.03em}
.wz-in::placeholder{color:var(--ink35);font-weight:500}
.wz-opt{display:flex;align-items:center;gap:11px;height:64px;padding:0 16px;border-radius:var(--rInput);
  font-size:15px;font-weight:700;letter-spacing:-.03em;text-align:left;box-shadow:var(--outline);
  color:var(--ink70);transition:background .16s ease,color .16s ease}
.wz-opt .mark{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--ink20)}
.wz-opt.on{background:var(--purple700);color:#fff;box-shadow:none}
.wz-opt.on .mark{background:#fff;color:var(--purple700);box-shadow:none;animation:pop .2s var(--ePop)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
/* 슬라이더 */
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:var(--lineSoft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(46,0,64,.28),inset 0 0 0 6px var(--purple700);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(46,0,64,.28),inset 0 0 0 6px var(--purple700)}
/* 뒤로가기 셰브론은 오른쪽 화살표를 뒤집어 쓴다 */
[data-back] svg,[data-wz-back] svg{transform:scaleX(-1)}
</style>
</head>
<body>

<div class="app">
  <main id="view"></main>
  <nav class="tabbar" id="tabbar" hidden></nav>
</div>

<div class="toast" id="toast"></div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-h"></div>
  <div class="sh-b"></div>
</div>

<script src="site.js?v=202608040744"></script>
<script src="legal.js?v=202608040744"></script>
<script src="data.js?v=202608040744"></script>
<script src="articles.js?v=202608040744"></script>
<script>
/* 화면에서 쓰는 표기 사전 */
const COUNTRY_KO = {KR:'대한민국',CA:'캐나다',US:'미국',FR:'프랑스',NZ:'뉴질랜드',AU:'호주',
  DE:'독일',IT:'이탈리아',NL:'네덜란드',BE:'벨기에',GB:'영국',JP:'일본',TH:'태국'};
const SHOP_KO = {coupang:'쿠팡',brand_official:'공식몰',naver:'네이버',other:'판매처'};
</script>

</body>
